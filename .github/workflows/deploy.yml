name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout devmachine CLI
        uses: actions/checkout@v4
        with:
          repository: mydevmachine/devmachine
          path: cli
          fetch-depth: 0

      - name: Checkout devmachine packages
        uses: actions/checkout@v4
        with:
          repository: mydevmachine/packages
          path: packages-src
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the build scripts
        run: npm test

      - name: Fetch CLI docs
        run: npm run fetch-docs
        env:
          DEVMACHINE_CLI_DOCS: cli/docs

      - name: Fetch packages
        run: npm run fetch-packages
        env:
          DEVMACHINE_PACKAGES: packages-src

      - name: Build
        run: npx astro build

      - name: Index with Pagefind
        run: npx pagefind --site dist

      - name: Check links
        run: node scripts/check-links.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
